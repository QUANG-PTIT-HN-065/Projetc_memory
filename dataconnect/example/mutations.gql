# Tạo mới một TodoItem
mutation CreateTodoItem(
  $text: String!
  $completed: Boolean!
  $priority: PriorityLevel
  $deadline: Timestamp
) @auth(level: PUBLIC) {
  todoItem_insert(
    data: {
      text: $text
      completed: $completed
      priority: $priority
      deadline: $deadline
    }
  )
}

# Cập nhật một TodoItem theo ID
mutation UpdateTodoItem(
  $id: TodoItem_Key!
  $text: String
  $completed: Boolean
  $priority: PriorityLevel
  $deadline: Timestamp
) @auth(level: PUBLIC) {
  todoItem_update(
    key: $id
    data: {
      text: $text
      completed: $completed
      priority: $priority
      deadline: $deadline
    }
  )
}

# Xóa một TodoItem theo ID
mutation DeleteTodoItem($id: TodoItem_Key!) @auth(level: PUBLIC) {
  todoItem_delete(key: $id)
}

# Đánh dấu hoàn thành/chưa hoàn thành
mutation ToggleTodoItemCompleted(
  $id: TodoItem_Key!
  $completed: Boolean!
) @auth(level: PUBLIC) {
  todoItem_update(
    key: $id
    data: { completed: $completed }
  )
}

